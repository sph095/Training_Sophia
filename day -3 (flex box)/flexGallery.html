<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <link rel="icon" href="images\fairy favicon.png" type="images/png">
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            font-family: arial;
            background-color: rgb(149, 201, 145);
            justify-content: center;
            align-items: center;
        }
        h1,p{
            color:rgb(97, 37, 37);
        }
        .flex-container{
            display: flex;
            flex-wrap: wrap;
            padding: 0 5px;
        }
        .row{
           padding: 0 5px;          
        }
        img{
            border-radius:10px;
            padding: 5px 5px;
        }
        @media screen and (max-width: 800px) {
        .row {
            flex: 50%;
            max-width: 50%;
        }
}

        @media screen and (max-width: 600px) {
            .row {
                flex: 100%;
                max-width: 100%;
                }       
    </style>
</head>
<body>
    <h1>Welcome to Whimsie Web</h1>
    <p>Resize the browser window to see the responsive gallery</h2>
    <br>
    <div class="flex-container">
        <div class="row">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
        </div>
        <div class="row">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
        </div>
        <div class="row">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
            <img src="images\fairy3.png" width="100px" height="100px">
        </div>
    </div>
</body>
</html>
