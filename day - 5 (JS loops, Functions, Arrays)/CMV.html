 <title>Common Multiples Visualizer</title>

<body>
 <div class="container">
 <div class="heading">

      <p style="font-size: 20px;">Enter the numbers to find their common Multiples </p>

 <input type="number" id="num2" placeholder="Enter number" min="1" max="100" />
 <button id="goBtn">Go!</button>
  </div>
  <div id="output" class="grid"></div>
  
      <div id="msgs">
      <p id="msg1">Multiples are denoted using color code</p>
      <p id="msg2"></p>
      <p id="msg3"></p>
  </div>
</div>
