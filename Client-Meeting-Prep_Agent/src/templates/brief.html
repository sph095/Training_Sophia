<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executive Brief</title>
<style>
  :root {
    --ink: #e8eef2;
    --ink-dim: #9fb3c0;
    --bg: #0b1220;
    --panel: #111c2e;
    --line: #1e2f47;
    --accent: #2dd4bf;
    --accent-deep: #0f766e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 20px 72px;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(45, 212, 191, 0.12), transparent 60%),
      radial-gradient(900px 400px at 100% 0%, rgba(56, 189, 248, 0.08), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .brief {
    max-width: 860px;
    margin: 0 auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)), var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 44px 48px 52px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }

  .brief-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  .stamp {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }

  h1 {
    font-size: 30px;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    color: #ffffff;
  }

  h1::after {
    content: "";
    display: block;
    width: 64px;
    height: 3px;
    margin-top: 16px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  h2 {
    font-size: 17px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 38px 0 14px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h2::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.15);
    flex: none;
  }

  h3 { font-size: 15px; margin: 22px 0 8px; color: #ffffff; }

  p { margin: 0 0 14px; }

  ul, ol { margin: 0 0 16px; padding-left: 22px; }
  li { margin-bottom: 9px; }
  li::marker { color: var(--accent-deep); }

  strong { color: #ffffff; font-weight: 650; }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(45, 212, 191, 0.35);
    font-weight: 600;
    word-break: break-word;
  }
  a:hover { border-bottom-color: var(--accent); }

  blockquote {
    margin: 18px 0;
    padding: 12px 18px;
    border-left: 3px solid var(--accent);
    background: rgba(45, 212, 191, 0.06);
    border-radius: 0 10px 10px 0;
    color: var(--ink-dim);
  }

  code {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 6px;
  }

  hr {
    border: 0;
    height: 1px;
    margin: 32px 0;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }

  table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14.5px; }
  th {
    text-align: left;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 11px 12px;
    border-bottom: 1px solid rgba(30, 47, 71, 0.6);
    vertical-align: top;
  }
  tr:hover td { background: rgba(45, 212, 191, 0.04); }

  .brief-footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-dim);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  @media print {
    :root { --ink: #0f172a; --ink-dim: #475569; --line: #cbd5e1; --accent: #0f766e; }
    body { background: #ffffff; color: var(--ink); padding: 0; font-size: 12.5px; line-height: 1.5; }
    .brief {
      max-width: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #ffffff;
      padding: 0;
    }
    .brief-header { border-bottom: 2px solid var(--accent); }
    h1 { font-size: 22px; color: #0f172a; }
    h2 { font-size: 14px; margin: 20px 0 8px; break-after: avoid; }
    h1, h2, h3 { break-after: avoid; }
    li, tr, blockquote { break-inside: avoid; }
    a { color: #0f766e; border-bottom: none; }
    .brief-footer { font-size: 10.5px; }
  }

  @media (max-width: 640px) {
    .brief { padding: 28px 22px 36px; border-radius: 14px; }
    h1 { font-size: 24px; }
    .brief-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <main class="brief">
    <header class="brief-header">
      <span class="eyebrow">Client Meeting Prep</span>
      <span class="stamp">Executive Brief</span>
    </header>

    {content}

    <footer class="brief-footer">
      <span>Prepared by Client Meeting Prep Agent</span>
      <span>Sources cited inline</span>
    </footer>
  </main>
</body>
</html>
