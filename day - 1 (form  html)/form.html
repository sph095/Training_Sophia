<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="icon" href="images\fairy favicon.png" type="images/png">
</head>
<body> 
    <h3>Please fill your details below and press submit</h3>
    <label for="name">Your name:</label>
    <input type="text" id="name"></input>
    <br>
    <br>
    <label for="emailId">Your email:</label>
    <input type="mail" id="emailId"></input>
    <br>
    <br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob"></input>
    <br>
    <br>
    <label for="bio">Bio:</label>
    <textarea id="bio" name="message" rows="5" cols="40" placeholder="Write a description of yourself"></textarea>
    <br>
    <br>
    <label >Select available id proof:        </label>
    <br>
    <input type="radio" name="idProof">Aadhar</input>
    <br>
    <input type="radio" name="idProof">Pan Card</input>
    <br>
    <br>
    <input type="checkbox">I have a bank account</input>
    <br><br>

    <button type="submit" id="submitButton">Submit</button>

</body>
</html>
