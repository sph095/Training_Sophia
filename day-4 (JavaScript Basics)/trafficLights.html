<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Lights</title>
     <style>
        body{
            background-color: #F1F2F5;
        }
        .container{
            display: flex;
            justify-content: center;
        }
        .buttons{
            margin-top: 40px;
            display: flex;
            justify-content: space-around;
        }
        button{
            font-size: 1.1em;
            height: 40px;
            width: 100px;
        }
        h3{
            text-align: center;
            font-family: monospace;
            font-size:1.5em;
        }
       

    </style>
</head>
<body>
    <h3>Click the buttons below to change colour of the signal</h3>
    <div class="container">
         <img id="trafficLight" src="images\green light.PNG" width=100px height= 250px><br>
    </div>
    <div class="buttons">
        <button type="button" onclick="document.getElementById('trafficLight').src='images/green light.PNG'">Green</button>
        <button type="button" onclick="document.getElementById('trafficLight').src='images/yellow light.PNG'">Yellow</button>
        <button type="button" onclick="document.getElementById('trafficLight').src='images/red light.PNG'">Red</button>
    </div>
</body>
</html>
