<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images\fairy favicon.png" type="images/png">
    <title>flexing</title>
    <style>
        .children{
            border:3px solid pink;
            background-color: pink;
            height: 50px;
            width: 50px;
            text-align: center;
            margin-bottom: 50px;
        }
        .con1{
            display: flex;
            justify-content: center;
            align-items: center;
            gap:10px;

        }
        .con2{
            display: flex;
            justify-content: space-between;
        }
        .con3{
            display: flex;
            flex-direction: column;
        }
        .con4{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="con1">
        <div class="children">1</div>
        <div class="children">2</div>
        <div class="children">3</div>
    </div>
    <div class="con2">
        <div class="children">1</div>
        <div class="children">2</div>
        <div class="children">3</div>
    </div>
    <div class="con3">
        <div class="children">1</div>
        <div class="children">2</div>
        <div class="children">3</div>
    </div>
    
</body>
</html>
